server.port=9090

# DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blogging_app_apis
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
# show-sql is intentionally absent here — enabled only in application-dev.properties

# fileupload related configuration
spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB

project.image = images/

# Spring Security
# Spring Security logging — INFO for all profiles; override to DEBUG in application-dev.properties for local dev
logging.level.org.springframework.security=INFO

# each restart a new password is generated to access the APIs so customize this setting
# == Moved to Database Basic Auth ==
# spring.security.user.name=lakshy
# spring.security.user.password=lakshy
# spring.security.user.roles=ADMIN

spring.devtools.restart.log-condition-evaluation-delta=false

# JWT secret must be supplied via the JWT_SECRET environment variable.
# HS512 requires at least 64 decoded bytes. Generate with: openssl rand -base64 64
# NEVER commit a real value here. No fallback is intentional — startup fails fast if the var is absent.
jwt.secret=${JWT_SECRET}

# Comma-separated list of allowed CORS origins. Override with CORS_ALLOWED_ORIGINS env var in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Set to true when the application terminates TLS directly (i.e., not behind a reverse-proxy).
# Leave false when HTTPS is enforced at the load-balancer/nginx level (the common production setup).
server.require-ssl=false